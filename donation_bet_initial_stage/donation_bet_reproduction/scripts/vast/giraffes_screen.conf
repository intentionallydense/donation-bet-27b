[program:giraffes_screen]
command=/workspace/donation_bet_reproduction/scripts/vast/giraffes_screen.sh
directory=/workspace/donation_bet_reproduction
autostart=false
autorestart=unexpected
startsecs=10
startretries=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/giraffes_screen.log
stderr_logfile=/workspace/logs/giraffes_screen.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

